<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0ff"><title>마음 한 모금 | 감정 자판기</title>
<style>
:root{--bg:#f4f0ff;--ink:#302747;--muted:#817794;--purple:#8c79c7;--line:#e8e3f3;--pale:#eae4fa;--white:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f4f0ff,#fbf9ff 60%,#f0eaff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}.wrap{max-width:520px;margin:auto;padding:22px 17px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 20px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:#7565a9;font-weight:800}.brand{font-size:29px;letter-spacing:-1.3px;margin:5px 0 6px}.subtitle{color:var(--muted);font-size:14px;margin:0}.logo{height:52px;width:52px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 7px 20px #8c79c71c}.machine{background:#fff;border:1px solid #eee9f7;border-radius:27px;padding:15px;box-shadow:0 16px 40px #7866a515}.display{background:#eae4fa;border-radius:21px;padding:20px 14px 17px;text-align:center}.machine-art{height:112px;width:154px;margin:0 auto 9px;position:relative;background:#b8a9e7;border-radius:20px 20px 15px 15px;padding:10px}.window{height:68px;background:#faf8ff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.orb{width:35px;height:35px;border-radius:50%;background:#e3dafa;display:grid;place-items:center;font-size:19px}.slot{height:8px;width:95px;border-radius:9px;background:#d9d0f3}.buttons{height:22px;position:absolute;left:18px;right:18px;bottom:7px;border-radius:8px;background:#8c79c7;display:flex;align-items:center;justify-content:center;gap:7px}.buttons i{height:6px;width:6px;border-radius:50%;background:#fff}.display h2{font-size:19px;margin:7px 0}.display p{font-size:12px;color:#756b89;margin:0}.label{font-size:11px;color:#7565a9;letter-spacing:1px;font-weight:800;margin:19px 4px 10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{font:inherit;text-align:left;border:1.5px solid var(--line);background:#fbfaff;border-radius:17px;padding:14px 12px;min-height:112px;color:var(--ink);cursor:pointer;transition:.15s}.choice:active{transform:scale(.98)}.choice.selected{border-color:#9682d3;background:#eee8ff;box-shadow:0 0 0 2px #9682d322}.emoji{font-size:23px;display:block;margin-bottom:9px}.choice strong{display:block;font-size:13px;line-height:1.4}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.4}.primary{width:100%;border:0;border-radius:15px;padding:16px;margin-top:13px;background:#8c79c7;color:#fff;font-weight:750;font-size:15px;cursor:pointer}.primary:disabled{opacity:.4;cursor:default}.result{display:none;margin-top:14px;background:#f3efff;border:1px solid #ded4fa;border-radius:19px;padding:19px;animation:pop .2s ease}.result.show{display:block}.tag{font-size:11px;color:#806bc2;font-weight:800;letter-spacing:.7px}.result h3{font-size:22px;letter-spacing:-.7px;margin:10px 0}.result p{font-size:14px;line-height:1.7;color:#514765;margin:0}.rule{height:1px;background:#ded4fa;margin:15px 0}.tiplabel{font-size:11px;color:#806bc2;font-weight:800;margin-bottom:7px}.suggestion{font-size:14px;line-height:1.65;font-weight:650}.quote{background:#fff;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.6;color:#514765}.secondary{width:100%;border:1px solid #d8ccef;background:#fff;border-radius:13px;padding:12px;margin-top:13px;color:#685794;font-weight:700;font-size:13px}.foot{text-align:center;color:#9187a4;font-size:11px;line-height:1.6;margin:18px 12px 0}.privacy{margin-top:14px;color:#958ba7;font-size:10px;text-align:center}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">MOOD MACHINE · 001</div><h1 class="brand">마음 한 모금</h1><p class="subtitle">오늘의 마음을 하나 골라 봐.</p></div><div class="logo">☁️</div></header>
<section class="machine"><div class="display"><div class="machine-art"><div class="window"><div class="orb" id="orb">☁️</div><div class="slot"></div></div><div class="buttons"><i></i><i></i><i></i><i></i><i></i></div></div><h2>지금 어떤 마음이야?</h2><p>정답은 없어. 가장 가까운 마음을 골라 줘.</p></div>
<div class="label">TODAY'S MOOD · 하나만 선택하기</div><div class="choices" id="choices">
<button class="choice" data-id="comfort"><span class="emoji">☁️</span><strong>위로가 필요해</strong><small>오늘 조금 힘들었어</small></button>
<button class="choice" data-id="space"><span class="emoji">🌙</span><strong>혼자 있고 싶어</strong><small>잠깐 내버려 둬</small></button>
<button class="choice" data-id="listen"><span class="emoji">🎧</span><strong>그냥 들어줘</strong><small>해결책은 필요 없어</small></button>
<button class="choice" data-id="confused"><span class="emoji">🫧</span><strong>나도 내 맘을 모르겠어</strong><small>뭐가 필요한지 모르겠어</small></button>
</div><button id="draw" class="primary" disabled>마음 한 장 뽑기　→</button>
<section id="result" class="result" aria-live="polite"><div class="tag" id="tag"></div><h3 id="title"></h3><p id="body"></p><div class="rule"></div><div class="tiplabel">오늘의 작은 제안</div><div class="suggestion" id="tip"></div><div class="quote" id="action"></div><button id="again" class="secondary">다른 마음 뽑기 ↻</button></section>
</section><p class="foot">어떤 마음이든 괜찮아.<br>설명하지 않아도 시작할 수 있어.</p><div class="privacy">시연용 프로토타입 · 선택 내용은 저장되지 않아요.</div></main>
<script>
const data={comfort:{emoji:'☁️',tag:'오늘의 위로',title:'오늘도 충분히 애썼어.',body:'모든 걸 잘해내지 않아도 괜찮아. 오늘 하루를 버틴 것만으로도 네가 노력했다는 사실은 변하지 않아.',tip:'지금은 잠깐 쉬어도 괜찮아.',action:'물 한 잔 마시기 · 좋아하는 노래 듣기'},space:{emoji:'🌙',tag:'나만의 시간',title:'잠깐 멈춰도 괜찮아.',body:'누구에게나 혼자 생각을 정리할 시간이 필요해. 지금 바로 설명하거나 대답하지 않아도 돼.',tip:'필요한 시간을 먼저 확보해 봐.',action:'알림 잠시 끄기 · 조용한 곳에서 쉬기'},listen:{emoji:'🎧',tag:'말해도 괜찮아',title:'해결하지 않아도, 들어주는 것부터.',body:'네가 느끼는 감정을 누군가가 바로 고치거나 평가할 필요는 없어. 네 입장에서 무슨 일이 있었는지 천천히 이야기해도 돼.',tip:'믿을 만한 사람에게 이렇게 말해 봐.',action:'“조언보다는 그냥 내 얘기를 들어줬으면 좋겠어.”'},confused:{emoji:'🫧',tag:'감정 탐색 중',title:'아직 몰라도 괜찮아.',body:'기분을 정확한 단어로 설명하기 어려울 때도 있어. 지금 당장 이유를 찾아내려고 애쓰지 않아도 돼.',tip:'이 질문 하나부터 시작해 봐.',action:'“지금 나에게 가장 부담스러운 건 뭘까?”'}};
let selected='';const choices=[...document.querySelectorAll('.choice')],draw=document.querySelector('#draw'),result=document.querySelector('#result');choices.forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;choices.forEach(c=>c.classList.toggle('selected',c===b));draw.disabled=false;result.classList.remove('show')}));draw.addEventListener('click',()=>{if(!selected)return;const d=data[selected];document.querySelector('#orb').textContent=d.emoji;['tag','title','body','tip','action'].forEach(k=>document.querySelector('#'+k).textContent=d[k]);result.classList.add('show');draw.textContent='마음 뽑기 완료 ✓';result.scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#again').addEventListener('click',()=>{selected='';choices.forEach(c=>c.classList.remove('selected'));draw.disabled=true;draw.textContent='마음 한 장 뽑기　→';result.classList.remove('show');document.querySelector('#orb').textContent='☁️';document.querySelector('.display').scrollIntoView({behavior:'smooth',block:'nearest'})});
</script></body></html>
